[workspace]
resolver = "2"
members = [
    "crates/emp-app",
    "crates/emp-codex",
    "crates/emp-core",
    "crates/emp-history",
    "crates/emp-integration",
    "crates/emp-protocol",
    "crates/emp-router",
    "crates/emp-state",
    "crates/emp-transport",
]

[workspace.package]
version = "0.12.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

# Keep useful application backtraces without retaining full dependency symbols.
# Tests inherit the dev profile; use the same target directory for both.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.release]
lto = true
codegen-units = 1
strip = true
