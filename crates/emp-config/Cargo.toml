[package]
publish = false
name = "emp-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EMP 自身配置、账号配置、目录合并与 .emp 导入导出"

[lints]
workspace = true

[features]
test-support = []

[dependencies]
emp-domain = { path = "../emp-domain" }
emp-files = { path = "../emp-files" }
emp-storage = { path = "../emp-storage" }
base64 = "0.22"
getrandom = "0.2.17"
percent-encoding = "2.3.2"
scrypt = "0.12.0"
serde_json = { workspace = true }
sha2 = "0.10.9"
time = { version = "0.3.55", features = ["parsing"] }
zeroize = "1.9"
url = "2.5.7"

[dev-dependencies]
emp-test-support = { path = "../emp-test-support" }
serde = { workspace = true }
tempfile = "3.27"
