[package]
publish = false
name = "emp-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared fixtures and deadlines for EMP tests."

[features]
websocket = ["dep:emp-transport", "dep:polling", "dep:serde_json", "dep:socket2", "dep:tokio"]

[dependencies]
emp-domain = { path = "../emp-domain" }
emp-transport = { path = "../emp-transport", optional = true }
httparse = "=1.10.1"
polling = { version = "=3.11.0", default-features = false, optional = true }
serde_json = { workspace = true, optional = true }
socket2 = { version = "0.6.5", features = ["all"], optional = true }
tempfile = "3.27"
tokio = { version = "1.53.1", features = ["rt", "time"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[lints]
workspace = true
