[package]
publish = false
name = "emp-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "持久化凭据、用量账本与价格、额度历史和签名"

[lints]
workspace = true

[dependencies]
emp-domain = { path = "../emp-domain" }
emp-files = { path = "../emp-files" }
base64 = "0.22"
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto", "fernet_danger_timestamps"] }
num-bigint = "0.4.8"
num-traits = "0.2.19"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "functions", "hooks"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = "3.27"
