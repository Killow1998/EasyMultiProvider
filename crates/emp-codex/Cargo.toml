[package]
publish = false
name = "emp-codex"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Codex account and model-catalog compatibility for EMP."

[dependencies]
base64 = "0.22"
emp-state = { path = "../emp-state" }
emp-history = { path = "../emp-history" }
emp-transport = { path = "../emp-transport" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = "0.10.9"
plist = { version = "1.9", default-features = false }
tempfile = "3.27"
time = { version = "0.3.55", features = ["parsing"] }
zstd = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
] }
