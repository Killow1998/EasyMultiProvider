[package]
name = "emp-codex"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Codex account and model-catalog compatibility for EMP."

[dependencies]
base64 = "0.22"
emp-state = { path = "../emp-state" }
emp-history = { path = "../emp-history" }
emp-transport = { path = "../emp-transport" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = { workspace = true }
sha2 = "0.10.9"
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
