[package]
publish = false
name = "emp-state"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "State cryptography and filesystem vault compatibility for EMP."

[lints]
workspace = true

[dependencies]
emp-config = { path = "../emp-config" }
emp-files = { path = "../emp-files" }
emp-storage = { path = "../emp-storage" }
emp-domain = { path = "../emp-domain" }
getrandom = "0.2.17"
regex = "1.12"
serde_json = { workspace = true }
sha2 = "0.10.9"
time = { version = "0.3.55", features = ["formatting", "parsing"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64 = "0.22"
tempfile = "3.27"
