[package]
publish = false
name = "emp-state"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "State cryptography and filesystem vault compatibility for EMP."

[lints]
workspace = true

[dependencies]
emp-modules = { path = "../emp-modules" }
emp-files = { path = "../emp-files" }
emp-storage = { path = "../emp-storage" }
base64 = "0.22"
emp-core = { path = "../emp-core" }
getrandom = "0.2.17"
num-bigint = "0.4.8"
num-traits = "0.2.19"
percent-encoding = "2.3.2"
regex = "1.12"
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "functions", "hooks"] }
scrypt = "0.12.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
zeroize = "1.9"
url = "2.5.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27"
