[package]
name = "emp-state"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "State cryptography and filesystem vault compatibility for EMP."

[dependencies]
atomic-write-file = "0.3.1"
base64 = "0.22"
emp-core = { path = "../emp-core" }
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
getrandom = "0.2.17"
num-bigint = "0.4.8"
num-traits = "0.2.19"
regex = "1.12"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
scrypt = "0.12.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
flate2 = "1.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
tar = "0.4"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_JobObjects"] }

[dev-dependencies]
tempfile = "3.27"
