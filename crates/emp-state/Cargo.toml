[package]
name = "emp-state"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "State cryptography and filesystem vault compatibility for EMP."

[dependencies]
atomic-write-file = "0.3.1"
base64 = "0.22"
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
getrandom = "0.2.17"
scrypt = "0.12.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27"
