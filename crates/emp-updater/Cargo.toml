[package]
publish = false
name = "emp-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "发现、取得、验证和安装官方制品"

[lints]
workspace = true

[dependencies]
emp-files = { path = "../emp-files" }
flate2 = "1.1"
getrandom = "0.2.17"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_JobObjects"] }

[dev-dependencies]
tempfile = "3.27"
