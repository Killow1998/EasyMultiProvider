[package]
publish = false
name = "emp-files"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Private files, atomic writes, file transactions, cross-process locks, and Windows ACLs for EMP."

[lints]
workspace = true

[features]
test-support = []

[dependencies]
atomic-write-file = "0.3.1"
serde_json = { workspace = true }
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_Threading"] }

[dev-dependencies]
emp-test-support = { path = "../emp-test-support" }
