  finally{languageSaveBusy=false;}
}

const confirmedCapabilitySources = new Set(['manual','observed','advertised','official']);
function confirmedField(model, field) {
  const source = model?.capability_sources?.[field]?.source;
  if (!confirmedCapabilitySources.has(source)) return null;
  return model[field] ?? null;
}
// Codex only sends text and images; other stored modalities are kept but not offered.
const COMMON_MODALITIES = ['text', 'image'];
function modalityLabel(value) {
  const labels = language === 'en' ? {text:'text',image:'image',audio:'audio',video:'video'} : {text:'文本',image:'图像',audio:'音频',video:'视频'}; return labels[value] || value;
}
function visionStatus(model) {
  const modalities = confirmedField(model, 'input_modalities');
  if (!Array.isArray(modalities)) return 'unknown';
  return modalities.includes('image') ? 'supported' : 'unsupported';
}
function visionLabel(status) {
  return {unknown:tr('图像能力待确认','Image support not reported'),supported:tr('支持图像','vision supported'),unsupported:tr('不支持图像','vision not supported')}[status];
}
function capabilitySummary(model) {
  const parts = [];
  const inputs = Array.isArray(confirmedField(model, 'input_modalities')) ? confirmedField(model, 'input_modalities') : [];
  if (inputs.length) parts.push(tr('输入 ', 'Input ') + inputs.map(modalityLabel).map(esc).join('/'));
  else {
    const status=visionStatus(model),label=esc(visionLabel(status));
    const help=tr('当前记录没有可确认的输入模态声明，不代表不支持图像。在模型编辑中选择图像，或使用图像测试。','This record has no verified input modality declaration; it does not mean images are unsupported. Select image input in the model editor or use the image test.');
    parts.push(status==='unknown'?`<span tabindex="0" data-shadow-help="${esc(help)}">${label} ?</span>`:label);
  }
  const outputs = Array.isArray(confirmedField(model, 'output_modalities')) ? confirmedField(model, 'output_modalities') : [];
  if (outputs.length) parts.push(tr('输出 ', 'Output ') + outputs.map(modalityLabel).map(esc).join('/'));
  const protocols = Array.isArray(confirmedField(model, 'supported_protocols')) ? confirmedField(model, 'supported_protocols') : [];
  if (protocols.length) parts.push(protocols.map(protocolLabel).map(esc).join('/'));
  return parts.join(' · ');
}

function webFailureClass(error) {
  const message = String(error?.message || '').toLowerCase();
  if (error?.status) return 'http_error';
  if (message.includes('failed to fetch') || message.includes('network')) return 'network';
  if (message.includes('null') || message.includes('undefined') || message.includes('not a function')) return 'missing_element';
  if (error?.name === 'SyntaxError') return 'syntax_error';
  if (error?.name === 'TypeError') return 'type_error';
  return 'unknown';
}
function reportWebClientPhase(kind, phase, error = null, extra = {}) {
  const payload = Object.assign({kind, phase, page_id:webPageId, failure_class:error ? webFailureClass(error) : 'none'}, extra);
  managementFetch('/api/client-events', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), keepalive:true}).catch(() => {});
}
if (typeof window?.addEventListener === 'function') {
  window.addEventListener('error', event => reportWebClientPhase('window_error', 'failed', event.error || new Error('window error'), {line:Number(event.lineno)||0,column:Number(event.colno)||0}));
  window.addEventListener('unhandledrejection', event => reportWebClientPhase('unhandled_rejection', 'failed', event.reason instanceof Error ? event.reason : new Error('unhandled rejection')));
}
