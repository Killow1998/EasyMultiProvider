    </div>
    <div class="header-group">
      <button type="button" class="secondary" data-icon="settings" onclick="openSettings()" data-i18n="settings_menu"></button>

<script>
let state = null;
let integrationInfo = null;
let quotaStateTimer = null;
let quotaStateBusy = false;
let activitySnapshot = null;
let activityClockOffsetSeconds = 0;
let activityExpiryTimer = null;
let quotaUpdatePending = false;
let quotaUpdateRunning = false;
const refreshErrors = {};
const refreshingAccounts = new Set();
const quotaAnimationAccounts = new Set();
const resetAttempts = new Map();
const integrationVerificationAttempts = new Set();
const webPageId = `${Date.now().toString(36)}-${Math.random().toString(16).slice(2,10)}`;
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const management = createManagementClient({tr, fetch: (...args) => fetch(...args), storage:() => localStorage, window});
const {request:api, fetch:managementFetch, establish:establishSession, errorText:upstreamErrorText} = management;
const managementEvents = createManagementEvents({management,visible:()=>document.visibilityState !== 'hidden',onEvent:processManagementEvent,
  onStart:()=>{updateActivityDots();rescheduleActivityExpiry();void accountDetails.refresh();},onDisconnect:clearActivityConfidence});
const quotaDisplay = createQuotaDisplay({read:storedPreference, save:savePreference});
const contextHelp = createContextHelp({getState:() => state, tr});
const routingSettings = createRoutingSettings({getState:() => state, cloneState, persistState, openModal, closeModal, $, esc, tr, help:shadowHelp});
const ultraSettings = createUltraSettings({getState:() => state, cloneState, persistState, openModal, closeModal, $, esc, tr, help:shadowHelp});
const nativeLogin = createNativeLogin({onImported:refreshImportedAccounts});
const tutorials = createTutorials({openModal, $, tr, esc});
const settings = createSettings({quotaDisplay, getState:() => state, cloneState, persistState, openModal, $, esc, t, tr, help:shadowHelp, contextHelp, presentationOptions:quotaChoice => presentationSettingsHtml(quotaChoice), collaborationHelp:collaborationComparison});
const {open:openSettings, toggle:toggleSetting} = settings;
const callReports = createCallReports({api, getState:() => state, getActivity:() => activitySnapshot, getLanguage:() => language, openModal, $, esc, tr, periodPickerHtml, registerPeriodPicker});
const diagnostics = createDiagnostics({callReports, api, getLanguage:() => language, openModal, $, esc, t, tr, localTimeText, notice});
const {open:openDiagnostics, stop:stopDiagnostics, load:loadDiagnostics, loadSupport:loadSupportReport, downloadSupport:downloadSupportReport} = diagnostics;
let language = 'zh-CN';
const notifications = createNotifications({$,tr,getLanguage:()=>language});
function storedPreference(key, fallback) { try { return localStorage.getItem(key) || fallback; } catch (_) { return fallback; } }
function savePreference(key, value) { try { localStorage.setItem(key, value); } catch (_) {} }
function t(key, values) { return translateUiCopy(key, language, values); }
// The two-string form selects messages supplied by the backend or preview data.
function tr(key, values) { return typeof values === 'string' ? (language === 'en' ? values : key) : t(key, values); }
function applyTranslations() {
  if (document.documentElement) document.documentElement.lang = language;
  document.querySelectorAll('[data-i18n]').forEach(element => { element.textContent = t(element.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(element => { element.placeholder = t(element.dataset.i18nPlaceholder); });
  document.querySelectorAll('[data-i18n-aria-label]').forEach(element => { element.setAttribute('aria-label', t(element.dataset.i18nAriaLabel)); });
  notifications.refresh();
  if (integrationInfo) renderIntegration(integrationInfo);
  else $('integration_badge').textContent = t('loading');
}
let languageSaveBusy=false;
async function syncLanguage() {
  if(languageSaveBusy || !state || state.language===language)return;
  languageSaveBusy=true;
  try {
    while(state.language!==language){const chosen=language;await api('/api/language',{method:'POST',body:JSON.stringify({language:chosen})});state.language=chosen;}
  } catch(error){notice(tr("core.could_not_save_error_language")+error.message,true);}
  finally{languageSaveBusy=false;}
}
function setLanguage(value) { language = value === 'en' ? 'en' : 'zh-CN'; savePreference('emp-language', language); if ($('language_select')) $('language_select').value = language; applyTranslations(); if (state) fill(); if ($('update_notes') && updates.info()) renderUpdate(updates.info()); if(state)void syncLanguage(); }
function setTheme(value) { const theme = ['light','dark'].includes(value) ? value : 'system'; savePreference('emp-theme', theme); if (document.documentElement) document.documentElement.dataset.theme = theme; if ($('theme_select')) $('theme_select').value = theme; }
function applyPreferences() { language = storedPreference('emp-language', 'zh-CN') === 'en' ? 'en' : 'zh-CN'; setTheme(storedPreference('emp-theme', 'system')); if ($('language_select')) $('language_select').value = language; applyTranslations(); }

const officialProviders = {
  chatgpt: {id:'chatgpt-subscription', name:'ChatGPT Subscription', base_url:'https://chatgpt.com/backend-api/codex', protocol:'responses', auth_mode:'forward', hint:'转发当前 Codex 登录态，不需要 API Key'},
  openai: {id:'openai', name:'OpenAI', base_url:'https://api.openai.com/v1', protocol:'responses', auth_mode:'api_key', hint:'OpenAI Responses API'},
  gemini: {id:'gemini', name:'Gemini AI Studio', base_url:'https://generativelanguage.googleapis.com/v1beta/openai', protocol:'chat_completions', auth_mode:'api_key', hint:'Google OpenAI-compatible API'},
  anthropic: {id:'anthropic', name:'Anthropic API', base_url:'https://api.anthropic.com/v1', protocol:'anthropic_messages', auth_mode:'anthropic_api_key', hint:'Anthropic Messages API'},
  deepseek: {id:'deepseek', name:'DeepSeek', base_url:'https://api.deepseek.com', protocol:'chat_completions', auth_mode:'api_key', hint:'DeepSeek OpenAI-compatible API'},
  inception: {id:'inception', name:'Inception / Mercury', base_url:'https://api.inceptionlabs.ai/v1', protocol:'chat_completions', auth_mode:'api_key'},
  openrouter: {id:'openrouter', name:'OpenRouter', base_url:'https://openrouter.ai/api/v1', protocol:'responses', auth_mode:'api_key', hint:'OpenRouter OpenAI-compatible API'},
  xai: {id:'xai', name:'xAI', base_url:'https://api.x.ai/v1', protocol:'responses', auth_mode:'api_key', hint:'xAI Grok Responses API'},
  moonshot: {id:'moonshot-kimi', name:'Moonshot/Kimi', base_url:'https://api.moonshot.ai/v1', protocol:'chat_completions', auth_mode:'api_key', hint:'Kimi OpenAI-compatible API'},
  zhipu: {id:'zhipu-glm', name:'Zhipu/GLM', base_url:'https://api.z.ai/api/paas/v4', protocol:'chat_completions', auth_mode:'api_key', hint:'GLM OpenAI-compatible API'}
};

const serviceUsage = createServiceUsage({renderLifetime:shadowServiceUsage,esc, tr, number:value => new Intl.NumberFormat(language === 'en' ? 'en-US' : 'zh-CN').format(value || 0), money:value => new Intl.NumberFormat(language === 'en' ? 'en-US' : 'zh-CN', {style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:4}).format(value/1e9), dateTime:utcDateTimeText});
const usageReport = createUsageReport({api, $, tr, esc, getState:() => state, getLanguage:() => language, persistState, openModal, serviceUsage, callReports, eventsConnected:() => managementEvents.connected(), periods:{periodPickerHtml, registerPeriodPicker, setPeriod, periodPickers, periodLocalInput, timeAxisSvg}});
const {open:openUsage} = usageReport;
const services = createServiceList({
  getState:() => state, $, esc, tr, presets:officialProviders, icon:serviceIconHtml,
  activity:activityIndicatorHtml, serviceIcon:(...args)=>serviceActivityIcon(...args), updateServiceErrors:()=>{presentationUpdateServiceRequestErrors();presentationUpdateServiceErrorLabels();}, accountSummary:accountSummaryHtml, quotaMeters:(...args)=>presentationQuotaMeters(...args),
  refreshingAccounts, refreshErrors, quotaAnimationAccounts, updateActivityDots:() => updateActivityDots(), openModal, api,
  notice, usageSummary:serviceUsage, onMount:shadowDetailActions,settingsConflict:account=>subscriptionPreferenceConflicts(state,account)
});
const {render:renderServices, details:openProviderDetails} = services;
const accountDetails = createAccountDetails({renderInfo:shadowAccountInfo,getState:() => state, $, tr, esc, api, services, serviceUsage, persistState, uiIcon, subscriptionPlanLabel, resetCreditCount,
  confirmRemoval:question=>confirm(question),notice,closeModal,syncSavedCatalog,onRemoved:value=>{state=value;fill();}});
const {open:openAccountDetails, saveAlias:saveAccountAlias} = accountDetails;
const {open:openServiceChooser} = createServiceChooser({tr, esc, presets:officialProviders, icon:serviceIconHtml, openModal, getState:() => state});

const confirmedCapabilitySources = new Set(['manual','observed','advertised','official']);
function confirmedField(model, field) {
  const source = model?.capability_sources?.[field]?.source;
  if (!confirmedCapabilitySources.has(source)) return null;
  return model[field] ?? null;
}
// Codex only sends text and images; other stored modalities are kept but not offered.
const COMMON_MODALITIES = ['text', 'image'];
function modalityLabel(value) {
  const labels = {"text":tr("core.text"),"image":tr("core.image"),"audio":tr("core.audio"),"video":tr("core.video")}; return labels[value] || value;
}
function visionStatus(model) {
  const modalities = confirmedField(model, 'input_modalities');
  if (!Array.isArray(modalities)) return 'unknown';
  return modalities.includes('image') ? 'supported' : 'unsupported';
}
function visionLabel(status) {
  return {unknown:tr("core.image_support_not_reported"),supported:tr("core.vision_supported"),unsupported:tr("core.vision_not_supported")}[status];
}
function capabilitySummary(model) {
  const parts = [];
  const inputs = Array.isArray(confirmedField(model, 'input_modalities')) ? confirmedField(model, 'input_modalities') : [];
  if (inputs.length) parts.push(tr("core.input") + inputs.map(modalityLabel).map(esc).join('/'));
  else {
    const status=visionStatus(model),label=esc(visionLabel(status));
    const help=tr("core.this_record_has_no_verified_input_modality_declaration_it");
    parts.push(status==='unknown'?`<span tabindex="0" data-shadow-help="${esc(help)}">${label} ?</span>`:label);
  }
  const outputs = Array.isArray(confirmedField(model, 'output_modalities')) ? confirmedField(model, 'output_modalities') : [];
  if (outputs.length) parts.push(tr("core.output") + outputs.map(modalityLabel).map(esc).join('/'));
  const protocols = Array.isArray(confirmedField(model, 'supported_protocols')) ? confirmedField(model, 'supported_protocols') : [];
  if (protocols.length) parts.push(protocols.map(protocolLabel).map(esc).join('/'));
  return parts.join(' · ');
}

function webFailureClass(error) {
  const message = String(error?.message || '').toLowerCase();
  if (error?.status) return 'http_error';
  if (message.includes('failed to fetch') || message.includes('network')) return 'network';
  if (message.includes('null') || message.includes('undefined') || message.includes('not a function')) return 'missing_element';
  if (error?.name === 'SyntaxError') return 'syntax_error';
  if (error?.name === 'TypeError') return 'type_error';
  return 'unknown';
}
function reportWebClientPhase(kind, phase, error = null, extra = {}) {
  const payload = Object.assign({kind, phase, page_id:webPageId, failure_class:error ? webFailureClass(error) : 'none'}, extra);
  managementFetch('/api/client-events', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), keepalive:true}).catch(() => {});
}
if (typeof window?.addEventListener === 'function') {
  window.addEventListener('error', event => reportWebClientPhase('window_error', 'failed', event.error || new Error('window error'), {line:Number(event.lineno)||0,column:Number(event.colno)||0}));
  window.addEventListener('unhandledrejection', event => reportWebClientPhase('unhandled_rejection', 'failed', event.reason instanceof Error ? event.reason : new Error('unhandled rejection')));
}
function bytesToBase64(bytes) { let binary = ''; const chunk = 0x8000; for (let index = 0; index < bytes.length; index += chunk) binary += String.fromCharCode(...bytes.subarray(index, index + chunk)); return btoa(binary); }
function dismissNotice() { notifications.dismiss(); }
function notice(message, error = false) { notifications.show(message, error); }
function protocolLabel(value) { return ({auto:tr("core.auto_detect"),responses:'Responses',chat_completions:'Chat Completions',anthropic_messages:'Anthropic Messages'}[value] || value); }
function authLabel(value) { return ({api_key:'Bearer API Key',anthropic_api_key:'Anthropic API Key',forward:'Forward Codex auth'}[value] || value); }
function formatDate(value) {
  const number = Number(value);
  if (!Number.isFinite(number) || number <= 0) return '';
  const date = new Date(number > 100000000000 ? number : number * 1000);
  return Number.isNaN(date.getTime()) ? '' : date.toISOString().slice(0, 10);
}
function modelSort(left, right) {
  const visibility = Number(Boolean(right.enabled)) - Number(Boolean(left.enabled));
  if (visibility) return visibility;
  const release = Number(right.created_at || 0) - Number(left.created_at || 0);
  return release || String(left.id).localeCompare(String(right.id));
}

function presentationFor(route) {
  const all = state.catalog_presentations || (state.catalog_presentations = {});
  return all[route] || {catalog_alias:'', show_context:true, reasoning_summary:'auto'};
}
function familyPresentationFor(family) {
  const all = state.catalog_family_presentations || (state.catalog_family_presentations = {});
  const fallback = (state.catalog_families || []).find(item => item.id === family)?.presentation;
  return all[family] || fallback || {catalog_alias:'', show_context:true, reasoning_summary:'auto'};
}
function compactContext(value) {
  const tokens = Number(value || 0); if (!(tokens > 0)) return '?';
  if (tokens >= 1000000) return (tokens / 1000000).toFixed(2).replace(/0+$/, '').replace(/\.$/, '') + 'M';
  if (tokens >= 1000) return Math.round(tokens / 1000) + 'K';
  return String(Math.round(tokens));
}
// Codex only uses this share of a model's window (its own default is 95%).
function usableContext(model) {
  const maximum = Number(model?.context_window || 0); const percent = Number(model?.effective_context_window_percent) || 95;
  return maximum > 0 ? Math.max(1, Math.round(maximum * Math.min(percent, 100) / 100)) : 0;
}
function canonicalDisplayName(value) { return String(value || '').replace(/^\[\s*(?:\d+(?:\.\d+)?(?:K|M)?|\?)\]\s+/, '').replace(/\s+\[\s*(?:\d+(?:\.\d+)?(?:K|M)?|\?)\]$/, ''); }

async function refreshAccount(id, announce = true) { if (refreshingAccounts.has(id)) return false; const before = state.native_account?.id === id ? state.native_account : state.accounts.find(a => a.id === id); const previousQuota = accountQuotaSignature(before); refreshingAccounts.add(id); delete refreshErrors[id]; renderServices(); try { const result = await api('/api/accounts/' + encodeURIComponent(id) + '/quota', {method:'POST', body:'{}'}); if (previousQuota !== accountQuotaSignature(result.account)) quotaAnimationAccounts.add(id); if (state.native_account?.id === id) state.native_account = result.account; else { const index = state.accounts.findIndex(a => a.id === id); if (index >= 0) state.accounts[index] = result.account; } if (announce) notice(tr("core.account_quota_refreshed")); return true; } catch (error) { const message = quotaErrorText(error, id); refreshErrors[id] = message; if (error.payload?.error?.code === 'quota_auth_required' && state.native_account?.id !== id) { const account = state.accounts.find(a => a.id === id); if (account) account.credential_status = 'invalid'; } if (announce) notice(tr("core.refresh_failed") + ': ' + message, true); return false; } finally { refreshingAccounts.delete(id); renderServices(); } }

function openModal(title, body, submitLabel, submit, serviceContext = null, navigation = {}) {

  const back = navigation.back === undefined && sameService ? modalNavigation.back : navigation.back;
  stopModalFeatures();

  const backButton = $('modal_back');

  const closeButton = $('modal_close');

  $('modal_body').scrollTop = 0;

    case 'provider-edit': editProvider(id); return true;
