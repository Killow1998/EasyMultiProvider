<main>

      <button type="button" class="secondary" data-icon="activity" onclick="openDiagnostics()" data-i18n="diagnostics">性能</button>

    </div>
    <div class="header-group">
      <button type="button" class="secondary" data-icon="settings" onclick="openSettings()" data-i18n="settings_menu">设置</button>

    </div>
    <div class="header-group">
      <a class="repo-link" href="https://github.com/Killow1998/EasyMultiProvider" target="_blank" rel="noopener noreferrer">GitHub</a>

    </div>
    <div class="header-group">

const confirmedCapabilitySources = new Set(['manual','observed','advertised','official']);
function confirmedField(model, field) {
  const source = model?.capability_sources?.[field]?.source;
  if (!confirmedCapabilitySources.has(source)) return null;
  return model[field] ?? null;
}
// Codex only sends text and images; other stored modalities are kept but not offered.
const COMMON_MODALITIES = ['text', 'image'];
function modalityLabel(value) {
  const labels = language === 'en' ? {text:'text',image:'image',audio:'audio',video:'video'} : {text:'文本',image:'图像',audio:'音频',video:'视频'}; return labels[value] || value;
}
function visionStatus(model) {
  const modalities = confirmedField(model, 'input_modalities');
  if (!Array.isArray(modalities)) return 'unknown';
  return modalities.includes('image') ? 'supported' : 'unsupported';
}
function visionLabel(status) {
  return {unknown:tr('图像能力待确认','Image support not reported'),supported:tr('支持图像','vision supported'),unsupported:tr('不支持图像','vision not supported')}[status];
}
function capabilitySummary(model) {
  const parts = [];
  const inputs = Array.isArray(confirmedField(model, 'input_modalities')) ? confirmedField(model, 'input_modalities') : [];
  if (inputs.length) parts.push(tr('输入 ', 'Input ') + inputs.map(modalityLabel).map(esc).join('/'));
  else parts.push(esc(visionLabel(visionStatus(model))));
  const outputs = Array.isArray(confirmedField(model, 'output_modalities')) ? confirmedField(model, 'output_modalities') : [];
  if (outputs.length) parts.push(tr('输出 ', 'Output ') + outputs.map(modalityLabel).map(esc).join('/'));
  const protocols = Array.isArray(confirmedField(model, 'supported_protocols')) ? confirmedField(model, 'supported_protocols') : [];
  if (protocols.length) parts.push(protocols.map(protocolLabel).map(esc).join('/'));
  return parts.join(' · ');
}

function webFailureClass(error) {
  const message = String(error?.message || '').toLowerCase();
  if (error?.status) return 'http_error';
  if (message.includes('failed to fetch') || message.includes('network')) return 'network';
  if (message.includes('null') || message.includes('undefined') || message.includes('not a function')) return 'missing_element';
  if (error?.name === 'SyntaxError') return 'syntax_error';
  if (error?.name === 'TypeError') return 'type_error';
  return 'unknown';
}
function reportWebClientPhase(kind, phase, error = null, extra = {}) {
  const payload = Object.assign({kind, phase, page_id:webPageId, failure_class:error ? webFailureClass(error) : 'none'}, extra);
  managementFetch('/api/client-events', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload), keepalive:true}).catch(() => {});
}
if (typeof window?.addEventListener === 'function') {
  window.addEventListener('error', event => reportWebClientPhase('window_error', 'failed', event.error || new Error('window error'), {line:Number(event.lineno)||0,column:Number(event.colno)||0}));
  window.addEventListener('unhandledrejection', event => reportWebClientPhase('unhandled_rejection', 'failed', event.reason instanceof Error ? event.reason : new Error('unhandled rejection')));
}
function bytesToBase64(bytes) { let binary = ''; const chunk = 0x8000; for (let index = 0; index < bytes.length; index += chunk) binary += String.fromCharCode(...bytes.subarray(index, index + chunk)); return btoa(binary); }
async function exportMigration() {
  openModal(tr('导出 EMP 数据','Export EMP data'), `<p class="muted">${tr('选择导出内容','Choose what to export')}</p><div class="grid"><label class="inline-check"><input id="export_native" type="checkbox" checked>Native</label><label class="inline-check"><input id="export_subscriptions" type="checkbox" checked>${tr('其他 Subscription','Other subscriptions')}</label><label class="inline-check"><input id="export_external" type="checkbox" checked>External Provider</label></div><p class="muted">${tr('Native 包含本机登录凭据；导入后作为额外 Subscription 账号，不替换当前登录。','Native includes this machine’s login credentials; import adds a Subscription account without replacing the current login.')}</p><p class="muted">${tr('导出密码至少需要 12 个 UTF-8 字节；旧版 8 字节迁移包仍可导入。','Exports require at least 12 UTF-8 bytes; legacy 8-byte migration bundles remain importable.')}</p><label>${tr('迁移密码','Migration password')}<input id="modal_migration_password" type="password" autocomplete="new-password" autofocus></label><label>${tr('确认迁移密码','Confirm password')}<input id="modal_migration_password_confirm" type="password" autocomplete="new-password"></label>`, tr('下载 .emp','Download .emp'), async () => {
    const groups = ['native','subscriptions','external'].filter(group => $('export_' + group).checked);
    if (!groups.length) throw new Error(tr('请至少选择一类导出内容','Select at least one export category'));
    const password = $('modal_migration_password').value; const confirmPassword = $('modal_migration_password_confirm').value;
    if (password !== confirmPassword) throw new Error(tr('两次迁移密码不一致','The migration passwords do not match')); if (new TextEncoder().encode(password).length < 12) throw new Error(tr('导出密码至少需要 12 个 UTF-8 字节','Export passwords must be at least 12 UTF-8 bytes'));
    const exportRequest = {password, groups};
    if (!management.usesLegacyCookies()) {
      const confirmation = await api('/api/migration/export/confirm', {method:'POST', body:'{}'});
      exportRequest.confirmation = confirmation.confirmation;
    }
    const response = await managementFetch('/api/migration/export', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(exportRequest)});
    if (!response.ok) { let data = {}; try { data = await response.json(); } catch (_) {} if (response.status === 401) management.clear(); throw new Error(data.error?.message || response.statusText); }
    const summary = JSON.parse(response.headers.get('X-EMP-Export-Summary') || '{}');
    const blob = await response.blob(); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = migrationFilename(); document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 0); closeModal();
    const missing = summary.native_login_missing;
    notice(tr(`已导出：账户 ${summary.accounts ?? 0} 个，Provider ${summary.providers ?? 0} 个，模型 ${summary.models ?? 0} 个`,`Exported: ${summary.accounts ?? 0} accounts, ${summary.providers ?? 0} providers, ${summary.models ?? 0} models`) + (missing ? tr('；未找到 Native 登录凭据，仅导出其配置。','; Native login credentials were not found; only its settings were exported.') : ''), missing);
  });
}
function migrationFilename() { return 'EMP.emp'; }
function selectMigrationFile() { $('migration_file').click(); }
async function migrationFileChosen(input) {
  const file = input.files[0]; if (!file) return; if (file.size > 32 * 1024 * 1024) { input.value = ''; return notice(tr('EMP 文件不能超过 32 MB','EMP files cannot exceed 32 MB'), true); }
  pendingMigrationFile = file;
  openModal(tr('导入 EMP 数据','Import EMP data'), `<p class="muted">${tr('已选择','Selected')}：${esc(file.name)}<br>${tr('同 ID 且身份一致的账号会更新；账号冲突会保留双方并重命名导入项。Provider 和模型按 ID 合并。','Accounts with matching IDs and identities are updated; conflicting accounts are retained under new IDs. Providers and models are merged by ID.')}</p><label>${tr('迁移密码','Migration password')}<input id="modal_import_migration_password" type="password" autocomplete="current-password" autofocus></label>`, tr('导入并合并','Import and merge'), submitMigrationImport);

  const reasons = {timeout:tr('连接超时','connection timed out'), connection:tr('连接失败','connection failed'), PermissionDenied:tr('没有写入权限','permission denied'), StorageFull:tr('磁盘空间不足','disk full')};
  const detail = reasons[failure.reason] || (failure.http_status ? `HTTP ${failure.http_status}` : Number.isInteger(failure.os_error) ? tr(`系统错误 ${failure.os_error}`,`system error ${failure.os_error}`) : Number.isInteger(failure.exit_code) ? tr(`程序退出码 ${failure.exit_code}`,`exit code ${failure.exit_code}`) : '');
  const retries = Number.isInteger(failure.retry_count) && failure.retry_count > 0 ? tr(`已自动重试 ${failure.retry_count} 次。`, `Automatically retried ${failure.retry_count} times. `) : '';
  return retries + tr(`${stages[failure.stage]}时失败`, `Update failed while ${stages[failure.stage]}`) + (detail ? tr(`：${detail}`, `: ${detail}`) : '') + tr('。 ', '. ') + updateFailureAdvice(failure) + (info.error === 'install_rolled_back' ? tr(' 已恢复旧版。', ' The previous version has been restored.') : '');
}
function renderUpdateHint(info) {
  latestUpdateInfo = info;
  const button = $('check_update');
  const available = info.state === 'available' || (info.state === 'error' && info.latest_version && info.latest_version !== info.current_version);
  button?.classList.toggle('has-update', Boolean(available));
  if (button) {
    button.title = available ? tr(`有可用更新 v${info.latest_version}`, `Update available: v${info.latest_version}`) : t('check_update');
    button.setAttribute('aria-label', button.title);
  }
}
let updateHintBusy = false;
let updateHintCheckedAt = 0;
async function checkUpdateHint() {
  if (updateHintBusy || document.visibilityState === 'hidden' || Date.now() - updateHintCheckedAt < 6 * 60 * 60 * 1000) return;
  updateHintBusy = true;
  updateHintCheckedAt = Date.now();
  try {
    let info = await api('/api/updates');
    renderUpdateHint(info);
    if (['idle','current','no_release','error'].includes(info.state)) info = await api('/api/updates/check', {method:'POST', body:'{}'});
    // Only wait for this check to finish; no permanent background polling.
    for (let attempt = 0; info.state === 'checking' && attempt < 25; attempt++) {
      await new Promise(resolve => setTimeout(resolve, 1000));
      info = await api('/api/updates');
    }
    renderUpdateHint(info);
  } catch (_) {} finally { updateHintBusy = false; }
}
function renderUpdate(info) {
  renderUpdateHint(info);
  const labels = {
    idle:tr('检查可用版本。','Check for an available version.'), checking:tr('正在检查…','Checking…'),
    no_release:tr('暂无正式版更新。','No stable release is available.'), current:tr('当前已是最新版本。','You are up to date.'),
    available:tr(`发现新版本 v${info.latest_version}。`,`Version ${info.latest_version} is available.`),
    migration_required:tr('检测到旧的 Linux 系统级安装。请先退出 EMP 并恢复原生 Codex，再迁移到用户目录；现有配置会继续保留。','A legacy system-wide Linux installation was detected. Exit EMP and restore native Codex, then migrate to a user installation. Your existing configuration is preserved.'),
    downloading:tr(`正在后台下载 ${info.progress}%…`,`Downloading in the background: ${info.progress}%…`),
    verifying:tr('正在校验安装包…','Verifying the package…'), waiting:tr('下载完成，正在等待当前请求结束…','Download complete. Waiting for current requests to finish…'),
    installing:tr('正在安装并重启 EMP，完成后会打开新页面。','Installing and restarting EMP. A new page will open when ready.'),
    error:updateFailureLabel(info),
  };
  $('update_status').textContent = labels[info.state] || labels.idle;
  if (['checking','downloading'].includes(info.state) && info.retry_count > 0) $('update_status').textContent += tr(` 正在自动重试 ${info.retry_count}/${info.retry_limit}。`, ` Retrying automatically ${info.retry_count}/${info.retry_limit}.`);
  $('update_version').textContent = tr(`当前版本 v${info.current_version}`,`Current version: ${info.current_version}`);
  $('update_progress').hidden = !['downloading','verifying'].includes(info.state);
  $('update_progress').value = Number(info.progress) || 0;
  const install = $('update_install'); install.hidden = info.state !== 'available' || !info.supported;
  const release = $('update_release'); release.hidden = info.manual_update !== 'linux_system_migration';
  const commands = $('update_commands'); commands.hidden = info.manual_update !== 'linux_system_migration';
  const manual = $('update_manual'); manual.hidden = info.manual_update !== 'linux_system_migration';
  if (info.state === 'available' && !info.supported) $('update_status').textContent += tr(' 请使用 EMP 安装包启动后更新。',' Launch the packaged EMP app to update.');
}
function openLatestRelease() {
  const url = latestUpdateInfo?.release_url;
  if (url === 'https://github.com/Killow1998/EasyMultiProvider/releases/latest') window.open(url, '_blank', 'noopener');
}
async function copyLinuxMigrationCommands() {
  const commands = `curl -fL -o EMP-linux-x86_64-install.sh https://github.com/Killow1998/EasyMultiProvider/releases/latest/download/EMP-linux-x86_64-install.sh\nsh EMP-linux-x86_64-install.sh`;
  try { await navigator.clipboard.writeText(commands); notice(tr('迁移命令已复制。','Migration commands copied.')); }
  catch (_) { $('update_status').textContent = commands; }
}
async function pollUpdate(generation) {
  try {
    const info = await api('/api/updates');
    if (generation !== updatePollGeneration) return;
    renderUpdate(info);
    if (['checking','downloading','verifying','waiting','installing'].includes(info.state)) updatePollTimer = setTimeout(() => pollUpdate(generation), 1000);
  } catch (_) {
    if (generation === updatePollGeneration) $('update_status').textContent = tr('连接已断开。若正在更新，请等待 EMP 重新打开页面。','Connection closed. If updating, wait for EMP to reopen the page.');
  }
}
async function requestUpdate(operation) {
  stopUpdatePoll(); const generation = updatePollGeneration;
  $('update_install').disabled = true;
  try { const info = await api('/api/updates/' + operation, {method:'POST', body:'{}'}); if (generation === updatePollGeneration) { renderUpdate(info); pollUpdate(generation); } }
  catch (error) { if (generation === updatePollGeneration) $('update_status').textContent = error.message; }
  finally { if (generation === updatePollGeneration) $('update_install').disabled = false; }
}
async function quitEmp() {
  if (!confirm(tr('退出 EMP 并恢复原生 Codex？', 'Exit EMP and restore native Codex?'))) return;
  try {
    await api('/api/quit', {method:'POST', body:'{}'});
    openModal(tr('EMP 已退出', 'EMP has exited'), `<p>${tr('已恢复原生配置，可以关闭此页面。', 'Native configuration restored. You can close this page.')}</p>`, '', null);
  } catch (error) { notice(error.message, true); }
}

async function openUpdate() {
  openModal(tr('更新 EMP','Update EMP'), `<p id="update_version" class="muted"></p><div id="update_status" role="status" aria-live="polite">${tr('正在检查…','Checking…')}</div><progress id="update_progress" class="update-progress" max="100" hidden></progress><div id="update_manual" class="muted" hidden><p>${tr('建議：下載 Linux 雙語安裝腳本，退出目前 EMP 後執行。安裝器會詢問是否移除舊系統套件，並可遷移源碼目錄中的設定。','Recommended: download the bilingual Linux installer, exit EMP, then run it. The installer asks before removing a system package and can migrate configuration from a source checkout.')}</p><p>${tr('舊系統安裝的使用者設定會保留；來源設定也只會複製，不會刪除。','Existing system-install user settings are kept; source settings are copied and remain in place.')}</p></div><div class="modal-actions"><button id="update_release" type="button" class="secondary" hidden onclick="openLatestRelease()">${tr('打開最新 Release','Open latest Release')}</button><button id="update_commands" type="button" class="secondary" hidden onclick="copyLinuxMigrationCommands()">${tr('複製安裝命令','Copy installer command')}</button><button id="update_install" type="button" data-icon="update" hidden onclick="requestUpdate('install')">${tr('后台更新','Update in background')}</button></div>`, '', null);
  await requestUpdate('check');
}
function dynamicActionElement(target) {
  return target instanceof Element ? target.closest('[data-ui-action]') : null;
}
function runDynamicUiAction(element) {
  const id = element.dataset.id || '';
  switch (element.dataset.uiAction) {
    case 'activity-details': callReports.openActivity(element); return true;
    case 'catalog-display-editor': openCatalogDisplayEditor(id); return true;
    case 'quota-display':
      quotaDisplay.set(element.dataset.mode);
      renderServices();
      if ($('quota_history_content') && quotaHistoryPayload) renderQuotaHistory(quotaHistoryPayload);
      $('modal_body').querySelectorAll('[data-ui-action="quota-display"]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === quotaDisplay.mode())));
      return true;
    case 'setting-toggle': toggleSetting(element); return true;
    case 'account-details': openAccountDetails(id); return true;
    case 'account-alias-save': saveAccountAlias(element); return true;
    case 'account-remove': removeAccount(id); return true;
    case 'account-edit': editAccount(id); return true;
    case 'account-refresh': refreshAccount(id); return true;
    case 'account-quota-history': openQuotaHistory(id); return true;
    case 'account-reset-credits': openResetCredits(id); return true;
    case 'period-preset': selectPeriodPreset(id, element.dataset.preset || ''); return true;
    case 'period-apply': applyCustomPeriod(id); return true;
    case 'period-refresh': refreshPeriod(id); return true;
    case 'period-edit': editPeriod(id); return true;
    case 'provider-quota-refresh': services.refresh(id); return true;
    case 'provider-quota-history': openQuotaHistory(id, 'providers'); return true;
    case 'provider-model-settings': providerModelSettings.open(id); return true;
    case 'provider-add-model': openManualModelModal('', id); return true;
    case 'provider-edit': editProvider(id); return true;
    case 'provider-toggle-models': toggleProviderModels(id, element.dataset.allHidden === 'true'); return true;
    case 'provider-details': openProviderDetails(id); return true;
    case 'service-native': if (state.native_account) openAccountDetails(state.native_account.id); return true;
    case 'service-import-account': openCodexImportChooser(); return true;
    case 'account-import-paste': codexAccountImport.paste(); return true;
    case 'account-import-file': codexAccountImport.chooseFile(); return true;
    case 'service-custom-api': openCustomProviderForm(); return true;
    case 'provider-remove': removeProvider(id); return true;
    case 'official-provider-choose': chooseOfficialProvider(element.dataset.provider || ''); return true;
    case 'claude-provider-choose': openClaudeConnectionChooser(); return true;
    case 'claude-local-choose': openLocalClaudeSubscriptionForm((state.providers || []).find(provider => provider.id === id) || {}); return true;
    case 'claude-cpa-choose': openClaudeCpaForm((state.providers || []).find(provider => provider.id === id) || {}); return true;
    case 'claude-change-connection': openClaudeConnectionChooser((state.providers || []).find(provider => provider.id === id) || {}); return true;
    case 'model-toggle': toggleModel(id, element.getAttribute('aria-pressed') !== 'true'); return true;
    case 'model-edit': openManualModelModal(id); return true;
    case 'model-test': testModel(id); return true;
    case 'model-remove': removeModel(id); return true;
    case 'model-group-toggle': toggleModelGroup(id); return true;
    default: return false;
  }
}
function handleDynamicUiClick(event) {
  const element = dynamicActionElement(event.target);
  if (element && !element.disabled && element.dataset.uiAction !== 'period-edit') runDynamicUiAction(element);
}
function handleDynamicUiChange(event) {
  const element = dynamicActionElement(event.target);
  if (element?.dataset.uiAction === 'period-edit') runDynamicUiAction(element);
}
function handleSubscriptionContextInput(event) {
  const input = event.target;
  if (!(input instanceof HTMLInputElement) || !input.hasAttribute('data-context-index')) return;
  const index = Number(input.dataset.contextIndex);
  if (Number.isInteger(index) && index >= 0) previewSubscriptionContext(input, index);
}
function handleModalKeydown(event) {
  if (event.key === 'Escape') {
    if (!$('modal_backdrop').classList.contains('hidden')) closeModal();
  }
}
document.addEventListener('click', handleDynamicUiClick);
document.addEventListener('change', handleDynamicUiChange);
document.addEventListener('keydown', handleModalKeydown);
document.addEventListener('input', handleSubscriptionContextInput);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { startQuotaEvents(); requestQuotaSync(); void checkUpdateHint(); } else stopQuotaEvents(); });
if (window.addEventListener) {
  window.addEventListener('storage', event => {
    if (management.receiveStorageEvent(event) && document.visibilityState !== 'hidden') startQuotaEvents();
  });
  window.addEventListener('pagehide', stopQuotaEvents);
  window.addEventListener('pageshow', startQuotaEvents);
}
establishSession().then(load).catch(error => notice(error.message, true));
</script>
