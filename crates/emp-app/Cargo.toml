[package]
name = "emp-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EMP native executable and local HTTP surface."

[[bin]]
name = "EMP"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
emp-core = { path = "../emp-core" }
emp-router = { path = "../emp-router" }
emp-state = { path = "../emp-state" }
emp-transport = { path = "../emp-transport" }
getrandom = "0.2.17"
serde_json = { workspace = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }

[lib]
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.27"
