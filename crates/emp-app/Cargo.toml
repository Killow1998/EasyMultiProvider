[package]
publish = false
name = "emp-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "EMP native executable and local HTTP surface."

[[bin]]
name = "EMP"
path = "src/main.rs"

[dependencies]
hotpath = { version = "=0.28.3", optional = true, default-features = false }
base64 = "0.22"
emp-codex = { path = "../emp-codex" }
emp-core = { path = "../emp-core" }
emp-history = { path = "../emp-history" }
emp-integration = { path = "../emp-integration" }
emp-protocol = { path = "../emp-protocol" }
emp-router = { path = "../emp-router" }
emp-state = { path = "../emp-state" }
emp-transport = { path = "../emp-transport" }
getrandom = "0.2.17"
hmac = "0.12.1"
if-addrs = "=0.15.0"
libc = "0.2.189"
polling = { version = "=3.11.0", default-features = false }
png = "0.18"
serde.workspace = true
serde_json = { workspace = true }
sha2 = "0.10.9"
shlex = "2.0.1"
tempfile = "3.27"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.7"

[features]
hotpath = ["dep:hotpath", "hotpath/hotpath", "emp-transport/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[lib]
path = "src/lib.rs"

[dev-dependencies]
flate2 = "1.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSDate", "NSRunLoop", "NSString", "NSThread"] }
