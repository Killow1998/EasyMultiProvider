[package]
publish = false
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native packaging, package smoke tests and release checks for EMP."

[lints]
workspace = true

[dependencies]
base64 = "0.22"
emp-modules = { path = "../crates/emp-modules" }
emp-updater = { path = "../crates/emp-updater" }
flate2 = "1.1"
proc-macro2 = { version = "1", features = ["span-locations"] }
ring = "0.17.14"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
syn = { version = "2", features = ["full", "visit"] }
tar = "0.4"
tempfile = "3.27"

[dev-dependencies]
emp-test-support = { path = "../crates/emp-test-support" }
