</div>

  const labels = language === 'en' ? {text:'text',image:'image',audio:'audio',video:'video'} : {text:'文本',image:'图像',audio:'音频',video:'视频'}; return labels[value] || value;

}
function visionLabel(status) {
  return {unknown:tr('图像未知','vision unknown'),supported:tr('支持图像','vision supported'),unsupported:tr('不支持图像','vision not supported')}[status];

  const parts = [];
  parts.push(esc(visionLabel(visionStatus(model))));

  if (inputs.length) parts.push(tr('输入 ', 'Input ') + inputs.map(modalityLabel).map(esc).join('/'));

  if (outputs.length) parts.push(tr('输出 ', 'Output ') + outputs.map(modalityLabel).map(esc).join('/'));

  if (protocols.length) parts.push(protocols.map(protocolLabel).map(esc).join('/'));

let usageRequest = 0, usagePayload = null, usagePreset = 'today', usagePoll = null;
const usageSource = value => ({native:'Native', subscription:tr('其他 Subscription','Other Subscription'), external:'External Provider', unknown:tr('来源未确认','Unknown source')}[value] || value);

function openUsage() {

    <div class="usage-filters"><label>${tr('开始 · 本地时间','From · local time')}<input type="datetime-local" id="usage_start" onchange="usagePreset=''"></label><label>${tr('结束 · 不包含此时刻','Until · exclusive')}<input type="datetime-local" id="usage_end" onchange="usagePreset=''"></label><button type="button" onclick="usagePreset='';loadUsage()">${tr('查询','Apply')}</button></div>

async function loadUsage(background = false) {

}
document.addEventListener('keydown', handleModalKeydown);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { startQuotaEvents(); requestQuotaSync(); } else stopQuotaEvents(); });
if (window.addEventListener) {
  window.addEventListener('pagehide', stopQuotaEvents);
  window.addEventListener('pageshow', startQuotaEvents);
}
load();
</script>
</body>
