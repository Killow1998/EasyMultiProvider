<main>

  <p id="codex_compatibility" class="muted" hidden></p>
  <div id="codex_runtimes" class="runtime-list"></div>
  <p id="codex_runtime_dirty" class="muted" hidden></p>
  <div class="integration-actions">
    <div class="action-group"><span class="action-group-label" data-i18n="client_scope">客户端</span><div class="runtime-controls"><button class="secondary" data-icon="check" onclick="useAutomaticCodexRuntimes()" data-i18n="automatic_runtimes">选择全部</button><button id="codex_runtime_save" class="secondary" data-icon="save" onclick="saveCodexRuntimeSelection()" data-i18n="save_runtimes">保存选择</button><button id="codex_runtime_scan" class="secondary" data-icon="refresh" onclick="scanCodexRuntimes()" data-i18n="rescan_runtimes">重新扫描</button></div></div>

</section>

<div id="accounts"></div>
</section>

<section>
<h2 data-i18n="providers_title">模型服务</h2>
<div class="toolbar"><button data-icon="plus" onclick="openProviderChooser()" data-i18n="add_provider">添加服务</button></div>

<h2 data-i18n="models_routes">模型</h2>
<div class="toolbar"><button data-icon="plus" onclick="openManualModelModal()" data-i18n="add_model">手动添加模型</button></div>

</div>

<div id="catalog_display_models" class="display-list"></div>
</section>
</aside>
</div>

</main>

<div id="status" class="muted" role="status" aria-live="polite"></div>

<div id="modal_backdrop" class="modal-backdrop hidden">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal_title">
    <div class="modal-header"><h2 id="modal_title"></h2><button type="button" class="modal-close" aria-label="Close" onclick="closeModal()">&times;</button></div>
    <div id="modal_body"></div>
    <div id="modal_status" class="modal-status" role="alert" aria-live="polite"></div>
    <div class="modal-actions"><button id="modal_submit" data-icon="check">确定</button></div>
  </div>
</div>

const officialProviders = {
  chatgpt: {id:'chatgpt-subscription', name:'ChatGPT Subscription', base_url:'https://chatgpt.com/backend-api/codex', protocol:'responses', auth_mode:'forward', hint:'转发当前 Codex 登录态，不需要 API Key'},

  anthropic: {id:'anthropic', name:'Anthropic', base_url:'https://api.anthropic.com/v1', protocol:'anthropic_messages', auth_mode:'anthropic_api_key', hint:'Anthropic Messages API'},

  xai: {id:'xai', name:'xAI', base_url:'https://api.x.ai/v1', protocol:'responses', auth_mode:'api_key', hint:'xAI Grok Responses API'},

const confirmedCapabilitySources = new Set(['manual','observed','advertised','official']);
function confirmedField(model, field) {
  const source = model?.capability_sources?.[field]?.source;
  if (!confirmedCapabilitySources.has(source)) return null;
  return model[field] ?? null;
}
function modalityLabel(value) {
  const labels = language === 'en' ? {text:'text',image:'image',audio:'audio',video:'video'} : {text:'文本',image:'图像',audio:'音频',video:'视频'}; return labels[value] || value;
}
function capabilitySummary(model) {
  const parts = [];
  const inputs = Array.isArray(confirmedField(model, 'input_modalities')) ? confirmedField(model, 'input_modalities') : [];
  if (inputs.length) parts.push(tr('输入 ', 'Input ') + inputs.map(modalityLabel).map(esc).join('/'));
  const outputs = Array.isArray(confirmedField(model, 'output_modalities')) ? confirmedField(model, 'output_modalities') : [];
  if (outputs.length) parts.push(tr('输出 ', 'Output ') + outputs.map(modalityLabel).map(esc).join('/'));
  const protocols = Array.isArray(confirmedField(model, 'supported_protocols')) ? confirmedField(model, 'supported_protocols') : [];
  if (protocols.length) parts.push(protocols.map(protocolLabel).map(esc).join('/'));
  return parts.join(' · ');
}

async function api(path, options = {}) {
  options.headers = Object.assign({'Content-Type':'application/json'}, options.headers || {});
  const response = await fetch(path, options);
  const text = await response.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch (_) { data = {error:{message:text || tr('服务器返回了无效响应', 'The server returned an invalid response')}}; }
  if (!response.ok) {
    const error = new Error(data.error?.message || response.statusText || `HTTP ${response.status}`);
    error.payload = data;
    error.status = response.status;
    throw error;
  }
  return data;
}
function bytesToBase64(bytes) { let binary = ''; const chunk = 0x8000; for (let index = 0; index < bytes.length; index += chunk) binary += String.fromCharCode(...bytes.subarray(index, index + chunk)); return btoa(binary); }
async function exportMigration() {
  openModal(tr('导出 EMP 数据','Export EMP data'), `<p class="muted">${tr('请设置至少 8 个字节的迁移密码。','Set a migration password of at least 8 bytes.')}</p><label>${tr('迁移密码','Migration password')}<input id="modal_migration_password" type="password" autocomplete="new-password" autofocus></label><label>${tr('确认迁移密码','Confirm password')}<input id="modal_migration_password_confirm" type="password" autocomplete="new-password"></label>`, tr('下载 .emp','Download .emp'), async () => {
    const password = $('modal_migration_password').value; const confirmPassword = $('modal_migration_password_confirm').value;
    if (password !== confirmPassword) throw new Error(tr('两次迁移密码不一致','The migration passwords do not match')); if (new TextEncoder().encode(password).length < 8) throw new Error(tr('迁移密码至少需要 8 个字节','The migration password must be at least 8 bytes'));
    const response = await fetch('/api/migration/export', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password})});
    if (!response.ok) { let data = {}; try { data = await response.json(); } catch (_) {} throw new Error(data.error?.message || response.statusText); }
    const blob = await response.blob(); const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = migrationFilename(); document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url); closeModal(); notice(tr('EMP 迁移包已下载','EMP data exported'));
  });
}
function migrationFilename() { return 'EMP.emp'; }
function selectMigrationFile() { $('migration_file').click(); }
async function migrationFileChosen(input) {
  const file = input.files[0]; if (!file) return; if (file.size > 32 * 1024 * 1024) { input.value = ''; return notice(tr('EMP 文件不能超过 32 MB','EMP files cannot exceed 32 MB'), true); }
  pendingMigrationFile = file;
  openModal(tr('导入 EMP 数据','Import EMP data'), `<p class="muted">${tr('已选择','Selected')}：${esc(file.name)}<br>${tr('同 ID 数据会合并，其他本地数据保留。','Matching IDs are merged; other local data is retained.')}</p><label>${tr('迁移密码','Migration password')}<input id="modal_import_migration_password" type="password" autocomplete="current-password" autofocus></label>`, tr('导入并合并','Import and merge'), submitMigrationImport);
}
async function submitMigrationImport() {
  const password = $('modal_import_migration_password').value; if (!password) throw new Error(tr('请填写迁移密码','Enter the migration password')); if (!pendingMigrationFile) throw new Error(tr('请重新选择 EMP 文件','Select the EMP file again'));

}
function notice(message, error = false) { $('status').textContent = message; $('status').className = error ? 'danger-text' : 'muted'; }
function protocolLabel(value) { return ({auto:tr('自动检测','Auto detect'),responses:'Responses',chat_completions:'Chat Completions',anthropic_messages:'Anthropic Messages'}[value] || value); }
function authLabel(value) { return ({api_key:'Bearer API Key',anthropic_api_key:'Anthropic API Key',forward:'Forward Codex auth'}[value] || value); }
function formatDate(value) {
  const number = Number(value);
  if (!Number.isFinite(number) || number <= 0) return '';
  const date = new Date(number > 100000000000 ? number : number * 1000);
  return Number.isNaN(date.getTime()) ? '' : date.toISOString().slice(0, 10);
}

async function saveManualModel() { const provider = $('modal_model_provider').value; const entered = $('modal_model_upstream').value.trim(); if (!provider || !entered) throw new Error(tr('Provider 和上游模型名不能为空','Provider and upstream model name are required')); const prefix = provider + '/'; const upstream = entered.startsWith(prefix) ? entered.slice(prefix.length) : entered; const id = prefix + upstream; const previous = state.models.find(m => m.id === editingModelId); const collision = state.models.find(m => m.id === id && m.id !== editingModelId); if (collision) throw new Error(tr('模型路由已存在，不能覆盖另一个模型','That model route already exists and cannot overwrite another model')); const levels = Array.isArray(modalReasoningLevels) ? modalReasoningLevels : (Array.isArray(previous?.reasoning_levels) ? previous.reasoning_levels : []); const support = typeof modalReasoningSupport === 'boolean' ? modalReasoningSupport : (typeof previous?.supports_reasoning === 'boolean' ? previous.supports_reasoning : (levels.length ? true : null)); const summarySupport = typeof modalReasoningSummarySupport === 'boolean' ? modalReasoningSummarySupport : (previous?.supports_reasoning_summaries ?? null); const model = {id, provider, display_name:previous?.display_name || upstream, description:previous?.description || '', upstream_id:upstream, family_id:previous?.family_id || '', supports_reasoning:support, supports_reasoning_summaries:summarySupport, reasoning_levels:levels, context_window:Number($('modal_model_context').value) || 0, created_at:previous?.created_at || 0, enabled:previous ? previous.enabled : true}; const candidate = cloneState(); if (editingModelId && editingModelId !== id) { candidate.models = candidate.models.filter(m => m.id !== editingModelId); movePresentation(editingModelId, id, candidate); } const index = candidate.models.findIndex(m => m.id === id); if (index >= 0) candidate.models[index] = model; else candidate.models.push(model); await persistState(previous ? tr('模型已修改','Model updated') : tr('模型已添加','Model added'), candidate); editingModelId = ''; modalReasoningLevels = null; modalReasoningSupport = null; modalReasoningSummarySupport = null; }
async function toggleModel(id, enabled) { const candidate = cloneState(); const model = candidate.models.find(item => item.id === id); if (!model) return; model.enabled = enabled; try { await persistState(enabled ? tr('模型已显示','Model is visible') : tr('模型已隐藏；已从 Codex /model 目录移除','Model hidden and removed from the Codex /model catalog'), candidate); } catch (error) { notice(error.message, true); } }
async function removeModel(id) { const candidate = cloneState(); candidate.models = candidate.models.filter(m => m.id !== id); try { await persistState(tr('模型已删除','Model deleted'), candidate); } catch (error) { notice(error.message, true); } }
async function testModel(id) { try { notice(tr(`正在测试 ${id} …`,`Testing ${id}…`)); const result = await api('/v1/responses', {method:'POST', body:JSON.stringify({model:id, input:'Reply with exactly EASY_MULTI_PROVIDER_TEST', max_output_tokens:512})}); notice(tr('测试成功：','Test succeeded: ') + (result.output_text || tr('已收到模型响应','model response received'))); } catch (error) { notice(tr('测试失败：','Test failed: ') + error.message, true); } }

function clearQuotaHistoryTimer() { if (quotaHistoryTimer !== null) clearInterval(quotaHistoryTimer); quotaHistoryTimer = null; }
function openModal(title, body, submitLabel, submit) { clearQuotaHistoryTimer(); $('modal_title').textContent = title; $('modal_body').innerHTML = body; $('modal_status').textContent = ''; const button = $('modal_submit'); const label = submitLabel || tr('确定','Confirm'); button.textContent = label; button.style.display = submit ? 'inline-block' : 'none'; button.disabled = false; button.onclick = submit ? async () => { button.disabled = true; button.textContent = tr('处理中…','Working…'); $('modal_status').textContent = ''; try { await submit(); } catch (error) { $('modal_status').textContent = error.message; } finally { button.disabled = false; button.textContent = label; } } : null; $('modal_backdrop').classList.remove('hidden'); }
function closeModal() { clearQuotaHistoryTimer(); $('modal_backdrop').classList.add('hidden'); $('modal_body').innerHTML = ''; $('modal_status').textContent = ''; $('modal_submit').onclick = null; }
function handleModalKeydown(event) { if (event.key === 'Escape' && !$('modal_backdrop').classList.contains('hidden')) closeModal(); }
document.addEventListener('keydown', handleModalKeydown);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshQuotaState(); });
load();
</script>
