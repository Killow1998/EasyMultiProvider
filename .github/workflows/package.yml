name: Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Optional exact source tag (for example v0.9.8); publishes a
          stable Release
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - "easy_multi_provider/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - "packaging/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "README.zh-CN.md"
      - "LICENSE"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/package.yml"
      - "easy_multi_provider/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - "packaging/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "README.zh-CN.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}-${{ inputs.release_tag || 'build' }}
  cancel-in-progress: ${{ inputs.release_tag == '' }}

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: Linux x64
            runner: ubuntu-22.04
          - name: macOS Intel
            runner: macos-15-intel
          - name: macOS Apple Silicon
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: 6
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/.emp-package-target
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1
        with:
          toolchain: 1.93.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install locked packaging environment
        run: uv sync --frozen --group package

      - name: Use a real temporary directory
        shell: python
        run: |
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]).resolve() / "emp-package"
          path.mkdir(exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for name in ("TMPDIR", "TMP", "TEMP"):
                  env.write(f"{name}={path}\n")

      - name: Build and smoke-test native package
        run: uv run --frozen --group package python packaging/build.py

      - name: Verify Windows executable resources
        if: runner.os == 'Windows'
        run: uv run --frozen --group package python -m unittest tests.test_windows_package -v

      - name: Verify native TLS validation and trusted roots
        run: >-
          cargo +1.93.1 test --locked --release -p emp-transport --test http_client
          tls_rejects_untrusted_and_wrong_host_but_accepts_a_trusted_name

      - name: Verify native background update and rollback
        env:
          EMP_PACKAGE_UPDATE_SMOKE: "1"
          EMP_PACKAGE_INSTALL_SMOKE: "1"
        run: uv run --frozen --group package python -m unittest tests.test_self_update tests.test_linux_update tests.test_user_install tests.test_packaged_self_update -v

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EMP-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main' &&
           inputs.release_tag != '') ||
          (github.event_name == 'push' &&
           startsWith(github.ref, 'refs/tags/v')) }}
    needs: package
    runs-on: ubuntu-22.04
    # Maintainers configure required reviewers for this environment in the
    # repository settings (Settings > Environments > release).
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "Release commit ${GITHUB_SHA} is not on ${DEFAULT_BRANCH}; refusing to publish." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download all native packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: EMP-*
          path: release-assets
          merge-multiple: true

      - name: Validate release version, manifest, and checksums
        env:
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.release_tag || github.ref_name }}
        run: >-
          python packaging/validate_release.py
          --tag "$RELEASE_TAG"
          --artifacts release-assets
          --public-manifest public-release-assets.txt

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Verify an existing tag targets this build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          tag_ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          commit_ref="repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}"
          if gh api "$tag_ref" >/dev/null 2>&1; then
            existing_sha="$(gh api "$commit_ref" --jq .sha)"
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "Tag ${RELEASE_TAG} targets ${existing_sha}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          mapfile -t public_assets < public-release-assets.txt
          if [ "${#public_assets[@]}" -ne 5 ]; then
            echo "Expected 5 user-facing release assets." >&2
            exit 1
          fi
          for asset in "${public_assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Public release asset is missing: $asset" >&2
              exit 1
            fi
          done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to replace published release ${RELEASE_TAG}." >&2
              exit 1
            fi
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --yes
          fi
          release_flags=(--latest)
          if [[ "$RELEASE_TAG" =~ (alpha|beta|rc) ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          python packaging/release_notes.py "$RELEASE_TAG" > release-notes.md
          gh release create "$RELEASE_TAG" "${public_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EMP $RELEASE_TAG" \
            --notes-file release-notes.md \
            "${release_flags[@]}"
