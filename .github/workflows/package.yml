name: Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Optional exact source tag (for example v0.9.8); publishes a
          stable Release
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - "easy_multi_provider/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - "packaging/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "README.zh-CN.md"
      - "LICENSE"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/package.yml"
      - "easy_multi_provider/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - "packaging/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "README.zh-CN.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}-${{ inputs.release_tag || 'build' }}
  cancel-in-progress: ${{ inputs.release_tag == '' }}

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: Linux x64
            runner: ubuntu-22.04
          - name: macOS Intel
            runner: macos-15-intel
          - name: macOS Apple Silicon
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: 6
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_TARGET_DIR: ${{ runner.temp }}/emp-package-target
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Check out formal Python oracle
        uses: actions/checkout@v7.0.1
        with:
          repository: Killow1998/EasyMultiProvider
          ref: ${{ github.sha }}
          path: python-oracle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install locked packaging environment
        run: uv sync --frozen --group package

      - name: Use a real temporary directory
        shell: python
        run: |
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]).resolve() / "emp-package"
          path.mkdir(exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for name in ("TMPDIR", "TMP", "TEMP"):
                  env.write(f"{name}={path}\n")

      - name: Build and smoke-test native package
        run: uv run --frozen --group package python packaging/build.py

      - name: Run formal Python and native Rust process E2E
        shell: python
        env:
          EMP_PYTHON_ORACLE_ROOT: ${{ github.workspace }}/python-oracle
        run: |
          import os
          import platform
          import subprocess
          from pathlib import Path

          artifacts = Path("artifacts")
          runner_os = os.environ.get("RUNNER_OS", platform.system())
          if runner_os == "Windows":
              candidates = [artifacts / "EMP.exe"]
          else:
              candidates = [
                  path for path in artifacts.iterdir()
                  if path.is_file()
                  and path.name.startswith("EMP-")
                  and not path.name.endswith((".sha256", ".tar.gz", ".dmg", ".zip", ".sh"))
                  and os.access(path, os.X_OK)
              ]
          candidates = [path for path in candidates if path.is_file()]
          if len(candidates) != 1:
              raise RuntimeError(f"expected one native EMP executable, found {len(candidates)}")

          environment = dict(os.environ)
          environment["EMP_RUST_BINARY"] = str(candidates[0].resolve())
          subprocess.run(
              ["uv", "run", "--frozen", "--group", "package", "python", "-m",
               "unittest", "tests.test_rust_e2e", "-v"],
              check=True,
              env=environment,
          )

      - name: Verify Windows executable resources
        if: runner.os == 'Windows'
        run: uv run --frozen --group package python -m unittest tests.test_windows_package -v

      - name: Verify native TLS validation and trusted roots
        run: >-
          cargo +1.93.1 test --locked --release -p emp-transport --test http_client
          tls_rejects_untrusted_and_wrong_host_but_accepts_a_trusted_name

      - name: Verify native background update and rollback
        env:
          EMP_PACKAGE_UPDATE_SMOKE: "1"
          EMP_PACKAGE_INSTALL_SMOKE: "1"
        run: uv run --frozen --group package python -m unittest tests.test_self_update tests.test_linux_update tests.test_user_install tests.test_packaged_self_update -v

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: EMP-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main' &&
           inputs.release_tag != '') ||
          (github.event_name == 'push' &&
           startsWith(github.ref, 'refs/tags/v')) }}
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Download all native packages
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: EMP-*
          path: release-assets
          merge-multiple: true

      - name: Validate release version, manifest, and checksums
        env:
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.release_tag || github.ref_name }}
        run: >-
          python packaging/validate_release.py
          --tag "$RELEASE_TAG"
          --artifacts release-assets
          --public-manifest public-release-assets.txt

      - name: Verify an existing tag targets this build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          tag_ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          commit_ref="repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}"
          if gh api "$tag_ref" >/dev/null 2>&1; then
            existing_sha="$(gh api "$commit_ref" --jq .sha)"
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "Tag ${RELEASE_TAG} targets ${existing_sha}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          mapfile -t public_assets < public-release-assets.txt
          if [ "${#public_assets[@]}" -ne 5 ]; then
            echo "Expected 5 user-facing release assets." >&2
            exit 1
          fi
          for asset in "${public_assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Public release asset is missing: $asset" >&2
              exit 1
            fi
          done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to replace published release ${RELEASE_TAG}." >&2
              exit 1
            fi
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --yes
          fi
          release_flags=(--latest)
          if [[ "$RELEASE_TAG" =~ (alpha|beta|rc) ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          python packaging/release_notes.py "$RELEASE_TAG" > release-notes.md
          gh release create "$RELEASE_TAG" "${public_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EMP $RELEASE_TAG" \
            --notes-file release-notes.md \
            "${release_flags[@]}"
