name: Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Optional exact source tag (for example v0.9.8); publishes a
          stable Release
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}-${{ inputs.release_tag || 'build' }}
  cancel-in-progress: ${{ inputs.release_tag == '' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: Linux x64
            runner: ubuntu-22.04
          - name: macOS Intel
            runner: macos-15-intel
          - name: macOS Apple Silicon
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: 6
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/.emp-package-target
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1

      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: package-${{ matrix.runner }}-1.93.1
          workspaces: ". -> .emp-package-target"
          cache-bin: false

      - name: Use a real temporary directory
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            package_temp="$(cygpath -w "$(cd "$RUNNER_TEMP" && pwd -P)/emp-package")"
            mkdir -p "$package_temp"
          else
            package_temp="$(mktemp -d /tmp/emp-package.XXXXXX)"
          fi
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$package_temp" "$package_temp" "$package_temp" >> "$GITHUB_ENV"

      - name: Build and smoke-test native package
        run: cargo +1.93.1 xtask package

      - name: Verify native TLS validation and trusted roots
        run: >-
          cargo +1.93.1 test --locked -p emp-transport --test http_client
          tls_rejects_untrusted_and_wrong_host_but_accepts_a_trusted_name

      - name: Verify native background update and rollback
        run: cargo +1.93.1 xtask package-smoke

      - name: Select classic console for Windows close-event tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # This disposable runner must expose a real console window: closing
          # a ConPTY proxy HWND does not send CTRL_CLOSE_EVENT to its client.
          $consoleKey = 'HKCU:\Console\%%Startup'
          New-Item -Path $consoleKey -Force | Out-Null
          foreach ($setting in @('DelegationConsole', 'DelegationTerminal')) {
            New-ItemProperty -Path $consoleKey -Name $setting -PropertyType String -Value '{B23D10C0-E52E-411E-9D5B-C09FDF709C7D}' -Force | Out-Null
          }

      - name: Verify startup recovery and native restoration on exit
        run: >-
          cargo +1.93.1 test --locked -p emp-app
          --test desktop_startup --test startup_recovery --test exit_process -- --test-threads=1

      - name: Verify tray actions preserve admitted requests and publish state
        run: cargo +1.93.1 test --locked -p emp-app --lib tray::actions::tests -- --test-threads=1

      - name: Verify request cancellation and socket teardown
        run: >-
          cargo +1.93.1 test --locked -p emp-app --lib
          disconnect -- --test-threads=1

      - name: Verify WebSocket readiness preserves blocking writes
        run: >-
          cargo +1.93.1 test --locked -p emp-transport --lib
          ready_reads_preserve_partial_frames_timeouts_and_blocking_writes

      - name: Verify Windows process handoff and private state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo +1.93.1 test --locked -p emp-state --lib update::process::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.93.1 test --locked -p emp-app --lib configured_browser_helpers_never_allocate_a_console
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.93.1 test --locked -p emp-transport --lib background_proxy_commands_never_allocate_a_console
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.93.1 test --locked -p emp-state --lib private_windows::tests -- --skip detects_directory_reparse_points

      - name: Upload package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EMP-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish Release
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main' &&
           inputs.release_tag != '') ||
          (github.event_name == 'push' &&
           startsWith(github.ref, 'refs/tags/v')) }}
    needs: package
    runs-on: ubuntu-22.04
    # Maintainers configure required reviewers for this environment in the
    # repository settings (Settings > Environments > release).
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify release commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "Release commit ${GITHUB_SHA} is not on ${DEFAULT_BRANCH}; refusing to publish." >&2
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1

      - name: Download all native packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: EMP-*
          path: release-assets
          merge-multiple: true

      - name: Validate release version, manifest, and checksums
        env:
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.release_tag || github.ref_name }}
        run: >-
          cargo +1.93.1 xtask validate-release
          --tag "$RELEASE_TAG"
          --artifacts release-assets
          --public-manifest public-release-assets.txt

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Verify an existing tag targets this build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          tag_ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          commit_ref="repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}"
          if gh api "$tag_ref" >/dev/null 2>&1; then
            existing_sha="$(gh api "$commit_ref" --jq .sha)"
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "Tag ${RELEASE_TAG} targets ${existing_sha}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
          fi

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          mapfile -t public_assets < public-release-assets.txt
          if [ "${#public_assets[@]}" -ne 6 ]; then
            echo "Expected 6 user-facing release assets." >&2
            exit 1
          fi
          for asset in "${public_assets[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "Public release asset is missing: $asset" >&2
              exit 1
            fi
          done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to replace published release ${RELEASE_TAG}." >&2
              exit 1
            fi
            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" --yes
          fi
          release_flags=(--latest)
          if [[ "$RELEASE_TAG" =~ (alpha|beta|rc) ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          cargo +1.93.1 xtask release-notes "$RELEASE_TAG" > release-notes.md
          gh release create "$RELEASE_TAG" "${public_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "EMP $RELEASE_TAG" \
            --notes-file release-notes.md \
            "${release_flags[@]}"
