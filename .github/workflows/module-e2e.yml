name: Module E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/emp-mod-*/**"
      - "crates/emp-modules/**"
      - "crates/emp-domain/src/usage.rs"
      - "modules/**"
      - "crates/emp-app/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/module-e2e.yml"

permissions:
  contents: read

concurrency:
  group: module-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: module-e2e-1.93.1
          cache-bin: false
      - name: Prepare Aero packager and temporary directory
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/aero-packager"
          "$RUNNER_TEMP/aero-packager/bin/python" -m pip install "pyinstaller==6.22.3"
          printf 'EMP_AERO_PYTHON=%s\n' "$RUNNER_TEMP/aero-packager/bin/python" >> "$GITHUB_ENV"
          path="$(cd "$RUNNER_TEMP" && pwd -P)/emp-modules"
          mkdir -p "$path"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$path" "$path" "$path" >> "$GITHUB_ENV"
      - run: cargo xtask module-e2e
