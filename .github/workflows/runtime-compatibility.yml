name: Runtime compatibility

on:
  pull_request:
    paths:
      - "easy_multi_provider/**"
      - "tests/**"
      - "tools/test_codex_runtime.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "contracts/**"
      - ".github/workflows/runtime-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "easy_multi_provider/**"
      - "tests/**"
      - "tools/test_codex_runtime.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "contracts/**"
      - ".github/workflows/runtime-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen
      - name: Use a real temporary directory for Rust Python oracles
        shell: python
        run: |
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]).resolve() / "emp-rust-contract"
          path.mkdir(exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for name in ("TMPDIR", "TMP", "TEMP"):
                  env.write(f"{name}={path}\n")
      - name: Set Python oracle for Rust differential tests
        shell: python
        run: |
          import os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          interpreter = root / ".venv" / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          if not interpreter.is_file():
              raise RuntimeError(f"missing Python oracle interpreter: {interpreter}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"EMP_PYTHON_INTEROP={interpreter}\n")
              env.write(f"EMP_PYTHON_ORACLE_ROOT={root}\n")
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Python and Rust state interoperability
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test python_interop
          rust_ciphertext_can_be_checked_by_the_python_oracle_when_configured
      - name: Python and Rust configuration interoperability
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test config_compat
          python_config_helpers_match_live_oracle_when_configured
      - name: Python and Rust integration-lock interoperability
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test file_lock
          rust_lock_contends_with_python_when_oracle_is_configured
      - name: Python and Rust provider normalization
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test provider_config_compat
          provider_normalization_matches_live_python_oracle_when_configured
      - name: Python and Rust model capability provenance
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test model_capability_source_compat
          model_capability_sources_match_live_python_oracle_when_configured
      - name: Python and Rust context calibrations
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test context_calibration_compat
          context_calibrations_match_live_python_oracle_when_configured
      - name: Python and Rust complete model normalization
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test model_normalization_compat
          model_normalization_matches_live_python_oracle_when_configured
      - name: Python and Rust full configuration normalization
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test config_normalization_compat
          configuration_normalization_matches_live_python_oracle_when_configured
      - name: Python and Rust Web update merge
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test web_update_merge_compat
          web_update_merge_matches_live_python_oracle_when_configured
      - name: Python and Rust private path canonicalization
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test private_path_compat
          private_paths_match_live_python_oracle_when_configured
      - name: Python and Rust configuration loading
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test config_load_compat
          config_load_matches_live_python_oracle_when_configured
      - name: Python and Rust configuration saving
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test config_save
          config_save_matches_live_python_oracle_when_configured
      - name: Python and Rust browser-safe configuration
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test public_config_compat
          public_configuration_matches_live_python_oracle_when_configured
      - name: Python and Rust migration importing
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test migration_import_compat
          migration_import_matches_live_python_oracle_when_configured
      - name: Python and Rust migration exporting
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test migration_export_compat
          migration_export_matches_live_python_oracle_when_configured
      - name: Python and Rust Web session persistence
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test web_session_compat
          rust_and_live_python_reuse_each_others_web_sessions

      - name: Python and Rust Chat projection interoperability
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-protocol --test python_oracle

      - name: Python and Rust portable Responses interoperability
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-protocol
          --test portable_python_oracle

      - name: Python and Rust portable Responses stream interoperability
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-protocol
          --test portable_stream_python_oracle

      - name: Python and Rust SSE parsing interoperability
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-transport --test python_oracle

      - name: Python and Rust HTTP client interoperability
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-transport --test http_client
          socket_behavior_matches_the_live_python_oracle_when_configured

      - name: Python and Rust external Router interoperability
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-router --test python_oracle

      - name: Python and Rust external Router stream interoperability
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-router
          --test streaming_python_oracle

      - name: Python and Rust route resolution
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-core
          --test route_python_oracle

      - name: Python and Rust account normalization
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test account_compat
          account_normalization_matches_live_python_oracle_when_configured
      - name: Python and Rust capability model values
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test model_values_compat
          capability_values_match_live_python_oracle_when_configured

  full-unit-suite:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen
      - name: Run complete unit suite
        run: uv run --frozen python -m unittest discover -s tests -t . -q

  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen
      - name: Use a real temporary directory
        shell: python
        run: |
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]).resolve() / "emp-contract"
          path.mkdir(exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for name in ("TMPDIR", "TMP", "TEMP"):
                  env.write(f"{name}={path}\n")
      - name: Protocol regression tests
        run: >-
          uv run --frozen python -m unittest -q
          tests.test_tool_bridge tests.test_review_boundaries tests.test_catalog tests.test_v06_dialects
          tests.test_codex_history tests.test_history_continuity
          tests.test_transport_continuity tests.test_native_websocket
          tests.test_native_model_boundary tests.test_native_route_owner tests.test_native_stream_fidelity
          tests.test_chat_projection_regressions
          tests.test_http_pool tests.test_http_pool_tls tests.test_provider_replay
          tests.test_migration
          tests.test_user_install
          tests.test_subscription_context
          tests.test_usage_ledger tests.test_usage_history
          tests.test_server.ServerAccountTests.test_migration_endpoints_export_and_import_emp_bundle
          tests.test_server.ServerAccountTests.test_migration_upload_accepts_base64_expansion_and_rejects_oversized_files
          tests.test_server.ContinuityAppStateTests
      - name: Install fixed official runtime
        run: npm install --prefix runtime-fixture --no-audit --no-fund --ignore-scripts @openai/codex@0.155.0
      - name: Official runtime contracts with local fixtures
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          names = {"codex.exe"} if os.name == "nt" else {"codex"}
          binaries = [p for p in Path("runtime-fixture/node_modules/@openai").rglob("*")
                      if p.is_file() and p.name in names and "vendor" in p.parts]
          if len(binaries) != 1:
              raise RuntimeError("expected one native Codex test binary")
          subprocess.run(["uv", "run", "--frozen", "python", "tools/test_codex_runtime.py",
                          str(binaries[0]), "--require-version", "0.155.0"], check=True)
      - name: Install recommended official runtime
        run: npm install --prefix runtime-fixture-1561 --no-audit --no-fund --ignore-scripts @openai/codex@0.156.1
      - name: Strict contracts for recommended runtime
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess

          names = {"codex.exe"} if os.name == "nt" else {"codex"}
          binaries = [
              path for path in Path("runtime-fixture-1561/node_modules/@openai").rglob("*")
              if path.is_file() and path.name in names and "vendor" in path.parts
          ]
          if len(binaries) != 1:
              raise RuntimeError("expected one native recommended Codex test binary")
          subprocess.run(
              ["uv", "run", "--frozen", "python", "tools/test_codex_runtime.py",
               str(binaries[0]), "--require-version", "0.156.1"],
              check=True,
          )
