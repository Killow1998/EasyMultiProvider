name: Runtime compatibility

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/**"
      - "xtask/**"
      - "contracts/**"
      - ".github/workflows/runtime-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/**"
      - "xtask/**"
      - "contracts/**"
      - ".github/workflows/runtime-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - name: Use a real temporary directory
        shell: bash
        run: |
          path="$(cd "$RUNNER_TEMP" && pwd -P)/emp-rust-contract"
          if [ "$RUNNER_OS" = Windows ]; then path="$(cygpath -w "$path")"; fi
          mkdir -p "$path"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$path" "$path" "$path" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
