name: Runtime compatibility

on:
  pull_request:
    paths:
      - "easy_multi_provider/**"
      - "tests/**"
      - "tools/test_codex_runtime.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "contracts/**"
      - ".github/workflows/runtime-compatibility.yml"
  push:
    branches: [main]
    paths:
      - "easy_multi_provider/**"
      - "tests/**"
      - "tools/test_codex_runtime.py"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "contracts/**"
      - ".github/workflows/runtime-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7.0.0
        if: matrix.os == 'ubuntu-22.04'
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
        if: matrix.os == 'ubuntu-22.04'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - name: Python and Rust state interoperability
        if: matrix.os == 'ubuntu-22.04'
        env:
          EMP_PYTHON_INTEROP: python
        run: >-
          uv run --frozen cargo test --locked -p emp-state --test python_interop
          rust_ciphertext_can_be_checked_by_the_python_oracle_when_configured

  full-unit-suite:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen
      - name: Run complete unit suite
        run: uv run --frozen python -m unittest discover -s tests -q

  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --frozen
      - name: Use a real temporary directory
        shell: python
        run: |
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]).resolve() / "emp-contract"
          path.mkdir(exist_ok=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for name in ("TMPDIR", "TMP", "TEMP"):
                  env.write(f"{name}={path}\n")
      - name: Protocol regression tests
        run: >-
          uv run --frozen python -m unittest -q
          tests.test_tool_bridge tests.test_review_boundaries tests.test_catalog tests.test_v06_dialects
          tests.test_codex_history tests.test_history_continuity
          tests.test_transport_continuity tests.test_native_websocket
          tests.test_native_model_boundary tests.test_native_route_owner tests.test_native_stream_fidelity
          tests.test_chat_projection_regressions
          tests.test_http_pool tests.test_http_pool_tls tests.test_provider_replay
          tests.test_migration
          tests.test_user_install
          tests.test_subscription_context
          tests.test_usage_ledger tests.test_usage_history
          tests.test_server.ServerAccountTests.test_migration_endpoints_export_and_import_emp_bundle
          tests.test_server.ServerAccountTests.test_migration_upload_accepts_base64_expansion_and_rejects_oversized_files
          tests.test_server.ContinuityAppStateTests
      - name: Install fixed official runtime
        run: npm install --prefix runtime-fixture --no-audit --no-fund --ignore-scripts @openai/codex@0.155.0
      - name: Official runtime contracts with local fixtures
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          names = {"codex.exe"} if os.name == "nt" else {"codex"}
          binaries = [p for p in Path("runtime-fixture/node_modules/@openai").rglob("*")
                      if p.is_file() and p.name in names and "vendor" in p.parts]
          if len(binaries) != 1:
              raise RuntimeError("expected one native Codex test binary")
          subprocess.run(["uv", "run", "--frozen", "python", "tools/test_codex_runtime.py",
                          str(binaries[0])], check=True)
