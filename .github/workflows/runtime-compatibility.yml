name: Runtime checks

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/**"
      - "xtask/**"
      - "contracts/**"
      - ".github/workflows/runtime-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1
        with:
          components: rustfmt, clippy
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: runtime-1.93.1
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Use a real temporary directory
        shell: bash
        run: |
          path="$(cd "$RUNNER_TEMP" && pwd -P)/emp-rust-contract"
          mkdir -p "$path"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$path" "$path" "$path" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets --no-fail-fast

  windows-exit:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: windows-exit-1.93.1
          cache-bin: false
      - name: Verify restoration before process exit
        run: cargo test --locked -p emp-app --lib lifecycle::shutdown::tests
      - name: Verify console close and session end using isolated EMP processes
        run: cargo test --locked -p emp-app --test exit_process
