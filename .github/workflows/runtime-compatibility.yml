name: Runtime checks

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/**"
      - "xtask/**"
      - "contracts/**"
      - ".github/workflows/runtime-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1
        with:
          components: rustfmt, clippy
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: runtime-1.93.1
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Use a real temporary directory
        shell: bash
        run: |
          path="$(cd "$RUNNER_TEMP" && pwd -P)/emp-rust-contract"
          mkdir -p "$path"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$path" "$path" "$path" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - name: Verify frontend copy and behavior
        run: |
          node crates/emp-app/tests/web_copy_contract.cjs
          node crates/emp-app/tests/web_features_contract.cjs
          node crates/emp-app/tests/web_lifecycle_contract.cjs
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets --no-fail-fast

  windows-exit:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: 0
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-exit-1.93.1
          cache-bin: false
      - name: Verify restoration before process exit
        run: cargo test --locked -p emp-app --lib lifecycle::shutdown::tests
      - name: Select classic console for Windows close-event tests
        shell: pwsh
        run: |
          # A ConPTY proxy HWND is not a closeable console window.
          $consoleKey = 'HKCU:\Console\%%Startup'
          New-Item -Path $consoleKey -Force | Out-Null
          foreach ($setting in @('DelegationConsole', 'DelegationTerminal')) {
            New-ItemProperty -Path $consoleKey -Name $setting -PropertyType String -Value '{B23D10C0-E52E-411E-9D5B-C09FDF709C7D}' -Force | Out-Null
          }
      - name: Verify console close and session end using isolated EMP processes
        run: cargo test --locked -p emp-app --test exit_process
