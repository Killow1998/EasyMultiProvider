name: Runtime checks

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - ".cargo/**"
      - "crates/**"
      - "xtask/**"
      - "contracts/*.sql"
      - "scripts/**"
      - "modules/**"
      - "README*.md"
      - "docs/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-22.04
    env:
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check GitHub Actions workflows
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --show-error --location --proto '=https' --proto-redir '=https' \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  rust-workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1
        with:
          components: rustfmt, clippy
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: runtime-1.93.1
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Use a real temporary directory
        shell: bash
        run: |
          path="$(cd "$RUNNER_TEMP" && pwd -P)/emp-rust-contract"
          mkdir -p "$path"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$path" "$path" "$path" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo xtask check
      - name: Verify frontend copy and behavior
        run: node --test crates/emp-app/tests/*_contract.cjs
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # --all-targets unifies features enabled by dev-dependencies, which can hide production branches from Clippy.
      - run: cargo clippy --locked --workspace --lib --bins -- -D warnings
      - name: Verify request cancellation with a symlinked temporary directory
        shell: bash
        run: |
          root=$(mktemp -d)
          trap 'rm -rf -- "$root"' EXIT
          mkdir -p "$root/real/fixtures"
          ln -s real "$root/link"
          unset EMP_TEST_TMPDIR
          TMPDIR="$root/link/fixtures" cargo xtask ci disconnect
      - run: cargo xtask ci workspace

  windows-exit:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c655e6902480079b4f4726174674b33218ce239c # 1.93.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-exit-1.93.1
          cache-bin: false
      - name: Verify private files, ACLs and the Windows vault
        run: cargo xtask ci windows-private-state
      - name: Verify restoration before process exit
        run: cargo xtask ci windows-shutdown
      - name: Verify admission release on client disconnect during a module request
        run: cargo xtask ci windows-module-runtime
      - name: Select classic console for Windows close-event tests
        shell: pwsh
        run: |
          # A ConPTY proxy HWND is not a closeable console window.
          $consoleKey = 'HKCU:\Console\%%Startup'
          New-Item -Path $consoleKey -Force | Out-Null
          foreach ($setting in @('DelegationConsole', 'DelegationTerminal')) {
            New-ItemProperty -Path $consoleKey -Name $setting -PropertyType String -Value '{B23D10C0-E52E-411E-9D5B-C09FDF709C7D}' -Force | Out-Null
          }
      - name: Verify console close and session end using isolated EMP processes
        run: cargo xtask ci windows-exit-process
