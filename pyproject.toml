[project]
name = "easy-multi-provider"
version = "0.9.7"
description = "Web-configured local model router for Codex"
requires-python = ">=3.8"
dependencies = [
    "cryptography>=2.8,<45",
    "psutil>=5.9,<8",
    "truststore>=0.10.4,<0.11 ; python_version >= '3.10'",
    "tomlkit>=0.13.2,<0.14",
    "websocket-client>=1.7,<1.9",
    "websockets>=15,<18 ; python_full_version >= '3.9'",
    "zstandard>=0.22,<1",
]
license = "MIT"

[project.scripts]
EMP = "easy_multi_provider.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["easy_multi_provider*"]

[tool.setuptools.package-data]
easy_multi_provider = ["web/index.html", "data/*.json"]

[dependency-groups]
package = [
    "pillow>=10.4,<13",
    "pyinstaller==6.21.0",
]
