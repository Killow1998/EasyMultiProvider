[project]
name = "easy-multi-provider"
version = "0.8.1"
description = "Web-configured local model router for Codex"
requires-python = ">=3.8"
dependencies = [
    "cryptography>=2.8,<45",
    "psutil>=5.9,<8",
    "tomlkit>=0.13.2,<0.14",
    "websocket-client>=1.7,<1.9",
    "zstandard>=0.22,<1",
]
license = "MIT"

[project.scripts]
easy-multi-provider = "easy_multi_provider.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["easy_multi_provider*"]

[tool.setuptools.package-data]
easy_multi_provider = ["web/index.html", "data/*.json"]
